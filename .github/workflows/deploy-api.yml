name: Deploy API

# Only from master, and only when something the image contains has changed. A docs-only commit
# should not restart the service.
on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'fly.toml'
      - '.dockerignore'
      - '.github/workflows/deploy-api.yml'

  # So a deploy can be re-run without an empty commit - after rotating a secret, for instance.
  workflow_dispatch:

# One deploy at a time. Two overlapping runs would fight over the same machine, and the second
# would win on timing rather than on being the newer commit. Not cancel-in-progress: killing a
# deploy midway is worse than letting it finish and superseding it.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Requires a FLY_API_TOKEN secret. Create it with `fly tokens create deploy -a cricket-live-api`,
    # which is scoped to deploying this one app rather than to the whole account.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only builds on Fly's builders rather than here, so the workflow does not need a
      # Docker daemon and the image never crosses the network twice.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The deploy command returns once the machine reports healthy, but that is Fly's view of it.
      # This asks the app the same question from outside, which is the part a reader cares about.
      - name: Verify the deployed app answers
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 https://cricket-live-api.fly.dev/api/health/ready; then
              echo "ready"
              exit 0
            fi
            echo "not ready yet, attempt $i"
            sleep 10
          done
          echo "The app did not report ready within 60 seconds."
          exit 1
