name: Frontend

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

defaults:
  run:
    working-directory: frontend

jobs:
  # See the note in backend.yml: this name is a required status check, so it has to be distinct.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      # The build refuses to run without this, because Vite inlines it and an unset variable
      # becomes the literal string "undefined" in every request URL rather than an error. CI is
      # checking that the code compiles, not producing a deployable bundle, so the value here is
      # explicitly a stand-in. The real one belongs to the host and is task 8.25.
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5140

  # Not a required check yet: a browser suite earns that by staying green for a while first.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Every API call is answered inside the test, so this needs no backend and spends no
      # provider allowance. The config builds the site against a placeholder address itself.
      - run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  # Phone-emulated Lighthouse on the built site, median of three runs. The API address refuses
  # connections at once, so this measures the app shell and its error states and spends nothing.
  # Not required yet, for the same reason as e2e.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:9

      - run: npx --yes @lhci/cli@0.15 autorun

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: frontend/lighthouse-report
          retention-days: 14
