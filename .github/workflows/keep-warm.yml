name: Keep Warm

on:
  schedule:
    # Every five minutes, to beat a spin-down that happens after about fifteen. GitHub's shortest
    # allowed interval is five, and on a free runner the schedule is best-effort rather than
    # punctual — a run can land ten or twenty minutes late when the queue is busy. Asking for five
    # is how you get something close to fifteen, which is the interval that actually matters.
    - cron: '*/5 * * * *'

  # So it can be proven to work without waiting for the scheduler.
  workflow_dispatch:

# Render's free tier stops the container after roughly fifteen minutes without traffic, and the
# next visitor waits thirty to sixty seconds for .NET to boot. Nothing is broken while that
# happens — the skeletons simply sit there — which is worse than an error, because it reads as a
# site that does not work rather than one that is starting.
#
# The cost is the honest reason this is a judgement call rather than an obvious win: Render
# includes 750 instance-hours a month and a service kept awake continuously uses about 730. It
# fits, but it fits *one* service. A second one on the same account would exceed the allowance and
# both would stop.

permissions: {}

concurrency:
  # A late run plus an on-time run is two pings arriving together, which is pointless rather than
  # harmful. Dropping the queued one keeps the log readable.
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake the API
        run: |
          # Liveness, not readiness, and the distinction is the point. /ready queries the archive,
          # which would wake the Neon compute too and spend its 100 CU-hours a month on a health
          # check nobody reads. /live reports only that the process is serving.
          url='https://cricket-live-api-qwo6.onrender.com/api/health/live'

          # --max-time generously, because a cold start is exactly the case this is here to cause
          # and waiting through one is the job rather than a failure.
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 120 "$url")

          echo "GET /api/health/live -> $code"

          if [ "$code" != "200" ]; then
            echo "::warning::Health check returned $code rather than 200"
          fi
