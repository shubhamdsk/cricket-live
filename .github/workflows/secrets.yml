name: Secret Scan

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# Our provider key is a bare GUID, which is indistinguishable from the match ids that legitimately
# fill this repository — so generic secret scanners cannot help us. What is distinctive is the
# shape the key appears in: CricketData echoes `"apikey":"<guid>"` into every response body, and
# authenticates with `?apikey=<guid>`. A captured response therefore looks like match data while
# carrying a live credential. These two patterns are what we scan for. Our own code writes
# `?apikey=` followed by a configuration value, never a literal, so a literal is always a mistake.

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fail if a provider key literal is committed
        run: |
          pattern='("apikey"[[:space:]]*:[[:space:]]*"|apikey=)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'

          # Tracked files only. An ignored file cannot be pushed, and scanning the whole working
          # directory would flag the local .spike/ captures that are deliberately kept out.
          if git ls-files -z | xargs -0 grep -In -E "$pattern"; then
            echo
            echo "::error::A CricketData API key literal is present in a tracked file."
            echo "Remove it, then rotate the key at https://cricketdata.org — anything pushed to a"
            echo "public repository must be treated as compromised even after the commit is gone."
            echo "The key belongs in user secrets locally and in CricketData__ApiKey when deployed."
            exit 1
          fi

          echo "No provider key literals found."
