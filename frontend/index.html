<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Everything here describes the site rather than a page, and is the fallback for the one reader
      that cannot run JavaScript. Routes are real paths now (docs/decisions.md, D-038), so a crawler
      that renders the page gets per-page tags from src/hooks/usePageMeta.ts, which overwrites these.

      Link unfurlers are the exception: Slack, Twitter and Facebook read the HTML as served and do
      not run the app, so what follows is what they will always show, whichever page was shared. A
      per-page preview needs the HTML to differ before JavaScript runs, which means pre-rendering,
      and that is a bigger change than this one.
    -->
    <title>Cricket Live · Live cricket scores, fixtures and results</title>
    <meta
      name="description"
      content="Live cricket scores, fixtures, results and series standings, updated while play continues."
    />
    <link rel="canonical" href="https://cricket-live-shubhamdsk1.vercel.app/" />

    <!-- SVG first for the browsers that take it, then the 32px raster, then favicon.ico for the
         ones that ask for it by path whether we link to it or not. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cricket Live" />
    <meta
      property="og:title"
      content="Cricket Live · Live cricket scores, fixtures and results"
    />
    <meta
      property="og:description"
      content="Live cricket scores, fixtures, results and series standings, updated while play continues."
    />
    <meta property="og:url" content="https://cricket-live-shubhamdsk1.vercel.app/" />
    <meta
      property="og:image"
      content="https://cricket-live-shubhamdsk1.vercel.app/social-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cricket Live — live scores, fixtures and results" />

    <!-- summary_large_image now that there is a 1200x630 asset behind it; with the small `summary`
         card the same image would be cropped to a square and lose the wordmark. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Cricket Live · Live cricket scores, fixtures and results"
    />
    <meta
      name="twitter:description"
      content="Live cricket scores, fixtures, results and series standings, updated while play continues."
    />
    <meta
      name="twitter:image"
      content="https://cricket-live-shubhamdsk1.vercel.app/social-card.png"
    />

    <!--
      Describes the site, not any match, so it is static and correct for every page. Match-level
      SportsEvent markup would have to be injected per page, and a crawler that runs our JavaScript
      can read the page itself; one that does not would be handed claims it cannot check.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Cricket Live",
        "url": "https://cricket-live-shubhamdsk1.vercel.app/",
        "description": "Live cricket scores, fixtures, results and series standings, updated while play continues.",
        "inLanguage": "en",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://cricket-live-shubhamdsk1.vercel.app/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Matches `--color-chrome`, so mobile browser chrome does not sit against the header as a
         visible seam. The dark value, because dark is the default; `src/store/themeStore.ts`
         rewrites it when the theme changes. -->
    <meta name="theme-color" content="#07090e" />

    <!--
      Blocking, inline, and before the stylesheet on purpose. Dark is the default and needs no
      class, so this does nothing at all for most visitors; for someone who chose light it adds the
      class before the first paint, which is the only way to avoid a flash of the wrong theme.

      Deferring it to the bundle would not work: by the time a module runs, the browser has already
      painted a dark page. The storage key is duplicated from `src/store/themeStore.ts` because a
      script in the document head cannot import, and that file says so too.
    -->
    <script>
      try {
        if (localStorage.getItem('cricket-live:theme') === 'light') {
          document.documentElement.classList.add('theme-light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff')
        }
      } catch (error) {
        // Storage can be refused outright in private browsing. The default theme is a fine answer.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
