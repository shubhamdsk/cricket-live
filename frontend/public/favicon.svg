<!--
  The tab icon: rounded, because nothing masks a favicon and a bare square looks unfinished beside
  everyone else's. icon-square.svg in ../brand is the full-bleed sibling for platforms that apply
  their own shape, and every raster icon is generated from the pair.

  The stitches are centred on the seam rather than hung off one side of it, which is the difference
  between a cricket ball and a fish skeleton.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Cricket Live</title>
  <rect width="64" height="64" rx="14" fill="#2563eb" />
  <circle cx="32" cy="32" r="17" fill="#ffffff" />
  <g fill="none" stroke="#2563eb" stroke-linecap="round" stroke-width="1.8">
    <path d="M36.9 17.4C43 23.5 43 40.5 36.9 46.6" />
    <path d="M36 20.2h5.6" />
    <path d="M37.9 25.7h5.6" />
    <path d="M38.6 32h5.6" />
    <path d="M37.9 38.3h5.6" />
    <path d="M36 43.8h5.6" />
  </g>
</svg>
